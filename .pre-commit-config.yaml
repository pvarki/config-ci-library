repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: local
    hooks:
      - id: generate-python-precommit
        name: Generate python.pre-commit-config.yaml
        entry: >-
          pre-commit/configs/generate.sh generate
          pre-commit/configs/python.pre-commit-config.yaml
          pre-commit/configs/components/common-base.pre-commit-config-component.yaml
          pre-commit/configs/components/common-format.pre-commit-config-component.yaml
          pre-commit/configs/components/python.pre-commit-config-component.yaml
          --
          "DETECT_SECRETS_ARGS=[--baseline, .secrets.baseline]"
        language: script
        pass_filenames: false
      - id: generate-typescript-precommit
        name: Generate typescript.pre-commit-config.yaml
        entry: >-
          pre-commit/configs/generate.sh generate
          pre-commit/configs/typescript.pre-commit-config.yaml
          pre-commit/configs/components/common-base.pre-commit-config-component.yaml
          pre-commit/configs/components/common-format.pre-commit-config-component.yaml
          pre-commit/configs/components/typescript.pre-commit-config-component.yaml
          --
          TS_DIR=.
          "DETECT_SECRETS_ARGS=[--baseline, .secrets.baseline]"
        language: script
        pass_filenames: false
      - id: generate-python-typescript-precommit
        name: Generate python+typescript.pre-commit-config.yaml
        entry: >-
          pre-commit/configs/generate.sh generate
          pre-commit/configs/python+typescript.pre-commit-config.yaml
          pre-commit/configs/components/common-base.pre-commit-config-component.yaml
          pre-commit/configs/components/common-format.pre-commit-config-component.yaml
          pre-commit/configs/components/python.pre-commit-config-component.yaml
          pre-commit/configs/components/typescript.pre-commit-config-component.yaml
          --
          TS_DIR=ui
          "DETECT_SECRETS_ARGS=[--baseline, .secrets.baseline]"
        language: script
        pass_filenames: false
      - id: generate-golang-precommit
        name: Generate golang.pre-commit-config.yaml
        entry: >-
          pre-commit/configs/generate.sh generate
          pre-commit/configs/golang.pre-commit-config.yaml
          pre-commit/configs/components/common-base.pre-commit-config-component.yaml
          pre-commit/configs/components/common-format.pre-commit-config-component.yaml
          pre-commit/configs/components/golang.pre-commit-config-component.yaml
          --
          "DETECT_SECRETS_ARGS=[--baseline, .secrets.baseline]"
        language: script
        pass_filenames: false
      - id: generate-terraform-precommit
        name: Generate terraform.pre-commit-config.yaml
        entry: >-
          pre-commit/configs/generate.sh generate
          pre-commit/configs/terraform.pre-commit-config.yaml
          pre-commit/configs/components/common-base.pre-commit-config-component.yaml
          pre-commit/configs/components/common-format.pre-commit-config-component.yaml
          pre-commit/configs/components/terraform.pre-commit-config-component.yaml
          --
          "DETECT_SECRETS_ARGS=[--baseline, .secrets.baseline]"
        language: script
        pass_filenames: false
      - id: generate-kubernetes-precommit
        name: Generate kubernetes.pre-commit-config.yaml
        entry: >-
          pre-commit/configs/generate.sh generate
          pre-commit/configs/kubernetes.pre-commit-config.yaml
          pre-commit/configs/components/common-base.pre-commit-config-component.yaml
          pre-commit/configs/components/kubernetes.pre-commit-config-component.yaml
          --
          'DETECT_SECRETS_ARGS=[--baseline, .secrets.baseline, --exclude-lines, "secretName:"]'
        language: script
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks-markup
    rev: v1.0.1
    hooks:
      - id: rst-linter
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Prettier
        files: \.(yml|yaml|json|md)$
        args:
          - --tab-width=2
          - --use-tabs=false
          - --cache-location=.prettier_cache
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
        stages: [pre-commit]
      - id: remove-crlf
        stages: [pre-commit]
      - id: forbid-tabs
        stages: [pre-commit]
      - id: remove-tabs
        stages: [pre-commit]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: "poetry.lock|ui/pnpm-lock.yaml"
        args: [--baseline, .secrets.baseline]
  - repo: local
    hooks:
      - id: validate-bumpversion-exists
        name: Validate .bumpversion.toml exists
        entry: pre-commit/hooks/validate-bumpversion/validate_bumpversion_exists.sh
        language: script
        pass_filenames: false
