name: Code Quality + Standards
on: [pull_request]

jobs:
  prek:
    runs-on: ubuntu-latest
    name: Run Pre-Commit Checks using Prek
    steps:
      - uses: actions/checkout@v6
      - uses: j178/prek-action@v2

  bumpversion-check-root:
    runs-on: ubuntu-latest
    name: Validate .bumpversion.toml
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/validate-bumpversion

  bumpversion-check-subdir:
    runs-on: ubuntu-latest
    name: Validate ./validate-bumpversion-tgtpractise/.bumpversion.toml
    steps:
      - uses: actions/checkout@v6
      - run: rm ./.bumpversion.toml
      - uses: ./.github/actions/validate-bumpversion
        with:
          version_context: "./validate-bumpversion-tgtpractise/"

  pre-commit-generated-check:
    runs-on: ubuntu-latest
    name: Check pre-commit configs are generated
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/check-precommit-generated

  publish:
    name: Build and publish selftest image
    needs: [bumpversion-check-root, pre-commit-generated-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish Docker image
        uses: ./.github/actions/publish-image
        with:
          product: ciselftest
          component: tool
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          acr-repo: ${{ vars.ACR_REPO }}
          acr-username: ${{ vars.ACR_USERNAME }}
          acr-token: ${{ secrets.ACR_TOKEN }}
