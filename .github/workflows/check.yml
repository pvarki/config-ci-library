name: Code Quality + Standards
on: [pull_request]

jobs:
  prek:
    runs-on: ubuntu-latest
    name: Run Pre-Commit Checks using Prek
    steps:
      - uses: actions/checkout@v6
      - uses: j178/prek-action@v2

  bumpversion-check-root:
    runs-on: ubuntu-latest
    name: Validate .bumpversion.toml
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/validate-bumpversion

  bumpversion-check-subdir:
    runs-on: ubuntu-latest
    name: Validate ./validate-bumpversion-tgtpractise/.bumpversion.toml
    steps:
      - uses: actions/checkout@v6
      - run: rm ./.bumpversion.toml
      - uses: ./.github/actions/validate-bumpversion
        with:
          version_context: "./validate-bumpversion-tgtpractise/"

  pre-commit-generated-check:
    runs-on: ubuntu-latest
    name: Check pre-commit configs are generated
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/check-precommit-generated

  publish:
    name: Build and publish selftest image
    needs: [bumpversion-check-root, pre-commit-generated-check]
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish Docker image
        uses: ./.github/actions/publish-image
        with:
          product: ciselftest
          component: tool
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          acr-repo: ${{ vars.ACR_REPO }}
          acr-username: ${{ vars.ACR_USERNAME }}
          acr-token: ${{ secrets.ACR_TOKEN }}

  publish-image-wrong-runner:
    name: publish-image rejects GitHub-hosted runner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run runner validation
        id: validation
        continue-on-error: true
        shell: bash
        run: |
          set +e

          output="$(
            .github/actions/publish-image/validate-runner.sh 2>&1
          )"
          rc=$?

          echo "$output"

          {
            echo "exit_code=$rc"
            echo "output<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$rc"

      - name: Assert expected failure
        shell: bash
        env:
          EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
          OUTPUT: ${{ steps.validation.outputs.output }}
        run: |
          test "$EXIT_CODE" -ne 0

          grep -F \
            "publish-image requires 'runs-on: arc-runner-set'" \
            <<<"$OUTPUT"
