name: Code Quality + Standards
on: [pull_request]

jobs:
  prek:
    runs-on: ubuntu-latest
    name: Run Pre-Commit Checks using Prek
    steps:
      - uses: actions/checkout@v6
      - uses: j178/prek-action@v2

  bumpversion-check-root:
    runs-on: ubuntu-latest
    name: Validate .bumpversion.toml
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/validate-bumpversion

  bumpversion-check-subdir:
    runs-on: ubuntu-latest
    name: Validate ./validate-bumpversion-tgtpractise/.bumpversion.toml
    steps:
      - uses: actions/checkout@v6
      - run: rm ./.bumpversion.toml
      - uses: ./.github/actions/validate-bumpversion
        with:
          version_context: "./validate-bumpversion-tgtpractise/"

  pre-commit-generated-check:
    runs-on: ubuntu-latest
    name: Check pre-commit configs are generated
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/check-precommit-generated

  release-notes-check:
    runs-on: ubuntu-latest
    name: Build release notes for this repo
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-notes
        id: notes
        with:
          tag: HEAD
          previous-tag: HEAD~5
          slides: pdf
      - name: Check the changelog was written
        run: |
          test -s "${{ steps.notes.outputs.out }}/changelog.md"
          cat "${{ steps.notes.outputs.out }}/changelog.md"

  tag-release-check:
    runs-on: ubuntu-latest
    name: Resolve the release tag for this repo
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tag-release
        id: tag
        with:
          dry-run: "true"
      - name: Check the tag matches the current version
        run: |
          VERSION=$(python3 -c "import tomllib; d=tomllib.load(open('.bumpversion.toml','rb')); print(d['tool']['bumpversion']['current_version'])")
          test "${{ steps.tag.outputs.tag }}" = "v${VERSION//+/-}"

  publish:
    name: Build and publish selftest image
    needs: [bumpversion-check-root, pre-commit-generated-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish Docker image
        uses: ./.github/actions/publish-image
        with:
          product: ciselftest
          component: tool
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          acr-repo: ${{ vars.ACR_REPO }}
          acr-username: ${{ vars.ACR_USERNAME }}
          acr-token: ${{ secrets.ACR_TOKEN }}
