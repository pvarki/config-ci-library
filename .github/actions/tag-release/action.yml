name: Tag release
description: Tag HEAD with the version from .bumpversion.toml, so a release can be made of it

inputs:
  # Context
  version_context:
    description: "Directory of .bumpversion.toml to use for version info"
    required: false
    default: "./"
  tag-prefix:
    description: "Prefix for the tag"
    required: false
    default: "v"
  dry-run:
    description: "Print the decision without tagging or pushing"
    required: false
    default: "false"

outputs:
  tag:
    description: "Tag to release, empty when this version was already released"
    value: ${{ steps.run.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Tag the current version
      id: run
      run: bash ${{ github.action_path }}/run.sh
      shell: bash
      env:
        VERSION_CONTEXT: ${{ inputs.version_context }}
        PREFIX: ${{ inputs.tag-prefix }}
        DRY_RUN: ${{ inputs.dry-run }}
