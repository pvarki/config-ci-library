name: Snyk Test
description: "Run Snyk test for a uv-based Python project.
  Prerequisite: setup python with uv"
inputs:
  snyk-org:
    required: true
    description: Snyk org slug to report results to
  snyk-token:
    required: true
    description: Snyk API token
  threshold:
    required: false
    description: "low, medium, high or critical"
    default: critical

runs:
  using: composite
  steps:
    - name: Freeze installed packages for Snyk
      run: |
        uv pip install pip
        uv pip freeze --exclude-editable > requirements.txt
      shell: bash
    - uses: snyk/actions/setup@b075801f26076be9bb50521154cafab73f44da0c # master as of 2026-10-03
    - name: Snyk test
      run: |
        snyk test \
          --file=requirements.txt \
          --command=.venv/bin/python \
          --org=${{ inputs.snyk-org }} \
          --show-vulnerable-paths=all \
          --severity-threshold=${{ inputs.threshold }}
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
