name: Validate bumpversion
description: Checks .bumpversion.toml exists, is parseable, and version was bumped

inputs:
  # Context
  version_context:
    description: "Directory of .bumpversion.toml to use for version info"
    required: false
    default: "./"

runs:
  using: composite
  steps:
    - name: Check .bumpversion.toml exists
      run: |
        cd ${{ inputs.version_context }}
        test -f .bumpversion.toml || (echo "ERROR: ${{ inputs.version_context }}: .bumpversion.toml not found" && exit 1)
      shell: bash
    - name: Install bump-my-version
      run: |
        pip install bump-my-version
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      shell: bash
    - name: Validate config is parseable
      run: |
        cd ${{ inputs.version_context }}
        bump-my-version show current_version --config-file .bumpversion.toml
      shell: bash
    - name: Validate version was bumped
      run: |
        cd ${{ inputs.version_context }}
        bash ${{ github.action_path }}/check_bump.sh
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        VERSION_PATH: ${{ inputs.version_context }}
