name: "Publish Docker Image"
description: "Build and push images to the enabled registries (GHCR, Docker Hub & ACR)"

inputs:
  # Naming
  product:
    description: "Product name (e.g. matrix, rasenmaeher). Normalized to lowercase with hyphens."
    required: true
  component:
    description: "Component type. One of: integration, server, client, api, ui, worker, tool."
    required: true
  # Context
  context:
    description: "Docker build context path"
    required: false
    default: "."
  target:
    description: "Docker build target"
    required: false
    default: "production"
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  platforms:
    description: "Target platforms"
    required: false
    default: "linux/amd64,linux/arm64"
  extra-tag:
    description: "Adds additional tag with <extra-tag>"
    required: false
    default: ""
  build-args:
    description: "Build args passed to docker build, one KEY=value per line."
    required: false
    default: ""
  # DockerHub
  dockerhub-username:
    description: "Docker Hub username. Omit all Docker Hub inputs to skip Docker Hub publishing."
    required: false
    default: "__UNSET__"
  dockerhub-token:
    description: "Docker Hub token"
    required: false
    default: "__UNSET__"
  # GitHub
  github-token:
    description: "Token to access GitHub. Omit to skip GHCR publishing."
    required: false
    default: "__UNSET__"
  # ACR
  acr-repo:
    description: "ACR hostname. Omit all ACR inputs to skip ACR publishing."
    required: false
    default: "__UNSET__"
  acr-username:
    description: "ACR username"
    required: false
    default: "__UNSET__"
  acr-token:
    description: "ACR token"
    required: false
    default: "__UNSET__"

outputs:
  tags:
    description: "Newline-separated list of tags pushed to the enabled registries"
    value: ${{ steps.meta.outputs.tags }}
  image-name:
    description: "Resolved image name in the form <owner>/<product>-<component>"
    value: ${{ steps.imgname.outputs.full }}

runs:
  using: composite
  steps:
    - name: Resolve image name
      id: imgname
      shell: bash
      run: |
        RAW_PRODUCT="${{ inputs.product }}"
        RAW_COMPONENT="${{ inputs.component }}"
        OWNER="${GITHUB_REPOSITORY_OWNER,,}"

        # Normalize product: lowercase, underscores/spaces -> hyphens, collapse and trim hyphens
        PRODUCT="${RAW_PRODUCT,,}"
        PRODUCT="${PRODUCT//_/-}"
        PRODUCT="${PRODUCT// /-}"
        PRODUCT=$(echo "$PRODUCT" | tr -s '-')
        PRODUCT="${PRODUCT#-}"
        PRODUCT="${PRODUCT%-}"

        if [ "$PRODUCT" != "$RAW_PRODUCT" ]; then
          echo "::notice::Normalized product '$RAW_PRODUCT' -> '$PRODUCT'"
        fi
        if ! [[ "$PRODUCT" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
          echo "::error::Product '$PRODUCT' contains invalid characters after normalization."
          exit 1
        fi
        COMPONENT="${RAW_COMPONENT,,}"
        if [ "$COMPONENT" != "$RAW_COMPONENT" ]; then
          echo "::notice::Normalized component '$RAW_COMPONENT' -> '$COMPONENT'"
        fi
        ALLOWED="integration server client api ui worker tool"
        if ! echo " $ALLOWED " | grep -q " $COMPONENT "; then
          echo "::error::Invalid component '$COMPONENT'. Must be one of: $ALLOWED"
          exit 1
        fi

        echo "full=${OWNER}/${PRODUCT}-${COMPONENT}" >> $GITHUB_OUTPUT

    - name: Resolve target registries
      id: registries
      shell: bash
      env:
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ACR_REPO: ${{ inputs.acr-repo }}
        ACR_USERNAME: ${{ inputs.acr-username }}
        ACR_TOKEN: ${{ inputs.acr-token }}
      run: |
        # Defaults only apply when the caller omits an input entirely, so each
        # input is in one of three states:
        #   unset - never passed (default "__UNSET__" applied)
        #   empty - passed but resolved to "" (e.g. referenced secret missing)
        #   set   - real value
        UNSET="__UNSET__"

        state() {
          if [ "$1" = "$UNSET" ]; then
            echo unset
          elif [ -z "$1" ]; then
            echo empty
          else
            echo set
          fi
        }

        # Per registry: all unset -> skip, all set -> publish,
        # any empty or a set/unset mix -> fail

        DH_USERNAME=$(state "$DOCKERHUB_USERNAME")
        DH_TOKEN=$(state "$DOCKERHUB_TOKEN")
        DOCKERHUB=false
        if [ "$DH_USERNAME" = "empty" ] || [ "$DH_TOKEN" = "empty" ]; then
          echo "::error::Docker Hub: dockerhub-username or dockerhub-token was passed but is empty. Check that the referenced secrets exist."
          exit 1
        elif [ "$DH_USERNAME" = "set" ] && [ "$DH_TOKEN" = "set" ]; then
          DOCKERHUB=true
        elif [ "$DH_USERNAME" = "set" ] || [ "$DH_TOKEN" = "set" ]; then
          echo "::error::Docker Hub: both dockerhub-username and dockerhub-token must be provided."
          exit 1
        fi

        GH_TOKEN=$(state "$GITHUB_TOKEN")
        GHCR=false
        if [ "$GH_TOKEN" = "empty" ]; then
          echo "::error::GHCR: github-token was passed but is empty. Check that the referenced secret exists."
          exit 1
        elif [ "$GH_TOKEN" = "set" ]; then
          GHCR=true
        fi

        ACR_R=$(state "$ACR_REPO")
        ACR_U=$(state "$ACR_USERNAME")
        ACR_T=$(state "$ACR_TOKEN")
        ACR=false
        if [ "$ACR_R" = "empty" ] || [ "$ACR_U" = "empty" ] || [ "$ACR_T" = "empty" ]; then
          echo "::error::ACR: acr-repo, acr-username or acr-token was passed but is empty. Check that the referenced secrets exist."
          exit 1
        elif [ "$ACR_R" = "set" ] && [ "$ACR_U" = "set" ] && [ "$ACR_T" = "set" ]; then
          ACR=true
        elif [ "$ACR_R" = "set" ] || [ "$ACR_U" = "set" ] || [ "$ACR_T" = "set" ]; then
          echo "::error::ACR: acr-repo, acr-username and acr-token must all be provided."
          exit 1
        fi

        # Publishing to zero registries fails action
        if [ "$DOCKERHUB" = false ] && [ "$GHCR" = false ] && [ "$ACR" = false ]; then
          echo "::error::No registry credentials provided. Set inputs for at least one of: Docker Hub, GHCR, ACR."
          exit 1
        fi

        echo "dockerhub=${DOCKERHUB}" >> $GITHUB_OUTPUT
        echo "ghcr=${GHCR}" >> $GITHUB_OUTPUT
        echo "acr=${ACR}" >> $GITHUB_OUTPUT

    - name: Log in to Docker Hub
      if: steps.registries.outputs.dockerhub == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Log in to GHCR
      if: steps.registries.outputs.ghcr == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Log in to ACR
      if: steps.registries.outputs.acr == 'true'
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.acr-repo }}
        username: ${{ inputs.acr-username }}
        password: ${{ inputs.acr-token }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Read version and compute dates
      id: version
      shell: bash
      run: |
        VERSION=$(python3 -c "import tomllib; d=tomllib.load(open('.bumpversion.toml','rb')); print(d['tool']['bumpversion']['current_version'])")
        BUILD_DATE=$(date -u +%Y%m%dT%H%M)
        REF_NO_SLASHES=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
        echo "ref_no_slashes=${REF_NO_SLASHES}" >> $GITHUB_OUTPUT

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          name=ghcr.io/${{ steps.imgname.outputs.full }},enable=${{ steps.registries.outputs.ghcr }}
          name=docker.io/${{ steps.imgname.outputs.full }},enable=${{ steps.registries.outputs.dockerhub }}
          name=${{ inputs.acr-repo }}/${{ steps.imgname.outputs.full }},enable=${{ steps.registries.outputs.acr }}
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_date }},enable={{is_default_branch}}
          type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
          type=raw,value=${{ steps.version.outputs.version }}-pr${{ github.event.number }}-${{ steps.version.outputs.build_date }},enable=${{ github.event_name == 'pull_request' }}
          type=raw,value=${{ steps.version.outputs.version }}-pr${{ github.event.number }},enable=${{ github.event_name == 'pull_request' }}
          type=raw,value=${{ steps.version.outputs.ref_no_slashes }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=${{ inputs.extra-tag }},enable=${{ inputs.extra-tag != '' }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        target: ${{ inputs.target }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
