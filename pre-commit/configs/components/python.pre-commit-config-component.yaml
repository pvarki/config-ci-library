- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.11
  hooks:
    - id: ruff-check
      types_or: [python, pyi]
      args: [--fix]
      stages: [pre-commit]
    - id: ruff-format
      types_or: [python, pyi]
      stages: [pre-commit]
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.2
  hooks:
    - id: bandit
      stages: [pre-commit]
      args: ["--exclude", ".tox,.eggs,tests"]
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.19.1
  hooks:
    - id: mypy
      stages: [pre-commit]
      additional_dependencies:
        - pydantic # + All other dependencies required by the project, pydantic added as an example
      args:
        - "--strict"
        - "--allow-untyped-decorators"
      language_version: python3.12
