- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.9
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.11
  hooks:
    - id: ruff-check
      types_or: [python, pyi]
      args: [--fix]
      stages: [pre-commit]
    - id: ruff-format
      types_or: [python, pyi]
      stages: [pre-commit]
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.2
  hooks:
    - id: bandit
      stages: [pre-commit]
      args: ["--exclude", ".tox,.eggs,tests"]
- repo: local # Local to get relevant dependencies
  hooks:
    - id: mypy
      name: mypy
      entry: mypy
      language: system
      types: [python]
      stages: [pre-commit]
      args:
        - "--strict"
        - "--allow-untyped-decorators"
