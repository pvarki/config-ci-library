- repo: https://github.com/antonbabenko/pre-commit-terraform
  rev: v1.109.0
  hooks:
    - id: terraform_fmt
      name: Format Terraform files
      stages: [pre-commit]
      args:
        - --hook-config=--tf-path=terraform
        - --hook-config=--tool-version=1.5.7
    - id: terraform_validate
      name: Validate Terraform files
      stages: [pre-commit]
      args:
        - --hook-config=--tf-path=terraform
        - --hook-config=--tool-version=1.5.7
    - id: terraform_tflint
      name: Lint Terraform files
      stages: [pre-commit]
      args:
        - --hook-config=--tool-version=0.64.0
    - id: terraform_trivy
      name: Run Trivy
      stages: [pre-commit]
      args:
        - --hook-config=--tool-version=0.74.0
        - --args=--severity=HIGH,CRITICAL
        - --args=--tf-exclude-downloaded-modules
- repo: local
  hooks:
    - id: forbid-terraform-state
      name: Forbid committing Terraform state
      entry: Terraform state may contain secrets and must never be committed
      language: fail
      files: '\.tfstate(\.backup)?$|(^|/)\.terraform/'
      stages: [pre-commit]
